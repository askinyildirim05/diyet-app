name: APK Uret

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Android platform dosyalarini uret
        run: flutter create --platforms android --org com.diyettakip .
      - name: Gradle 8e sabitle ve minSdk ayarla
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|flutter.minSdkVersion|23|' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's|flutter.minSdkVersion|23|' android/app/build.gradle 2>/dev/null || true
      - name: Bildirim paketi icin desugaring ac
        run: |
          sed -i 's|compileOptions {|compileOptions {\n        isCoreLibraryDesugaringEnabled = true|' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
      - name: R8 kod sikistirmayi kapat (bildirim kayit hatasi icin)
        run: |
          sed -i 's|release {|release {\n            isMinifyEnabled = false\n            isShrinkResources = false|' android/app/build.gradle.kts
          grep -n "isMinifyEnabled" android/app/build.gradle.kts
      - name: AdMob, izin ve uygulama adini manifeste gom
        run: |
          sed -i 's|apk/res/android">|apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5113050441647801~5970291753"/>\n    </application>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="diyet_takip"|android:label="Diyet Takip"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Yuklenen bildirim paketi surumunu goster
        run: grep -A2 'flutter_local_notifications' pubspec.lock | head -5
      - name: Ikonlari uret
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Play Store icin AAB uret
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: DiyetTakip-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DiyetTakip-AAB
          path: build/app/outputs/bundle/release/app-release.aab
